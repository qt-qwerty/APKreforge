name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour attacher l'APK à une release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Le dépôt n'a pas de gradle wrapper : on installe Gradle 8.9 (requis par AGP 8.7).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: LocalBuild-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Sur un tag vX.Y.Z : APK attaché à une release GitHub (téléchargeable depuis le téléphone)
      - name: Créer la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
